# ============================================================================
# XPENG Media Hub — déploiement en 1 clic sur NAS UGREEN (UGOS Pro)
#
#   UGOS Pro  →  Docker  →  Projet  →  Créer  →  coller ce fichier  →  Lancer
#
# Puis ouvre :  http://IP-DE-TON-NAS:8080
#
# Cette version télécharge une image déjà compilée (rien à construire).
# Pour construire depuis les sources à la place : docker-compose.build.yml
# ============================================================================

services:
  xpengmedia:
    image: ghcr.io/ppierre89/xpengmedia:latest
    container_name: xpengmedia
    restart: unless-stopped
    ports:
      # Change 8080 si le port est déjà pris sur ton NAS (ex: "8090:8080")
      - "8080:8080"
    environment:
      TZ: Europe/Paris
      # Mets true si ton serveur IPTV / playlist M3U est sur ton réseau local
      PROXY_ALLOW_PRIVATE: "false"
      # Certains serveurs Xtream n'acceptent que le User-Agent d'un vrai lecteur
      PROXY_USER_AGENT: "VLC/3.0.20 LibVLC/3.0.20"
      # Synchronisation entre appareils + données véhicule.
      # Tant qu'API_TOKEN est vide, ces deux API restent désactivées.
      # Générez un jeton :  openssl rand -base64 32
      API_TOKEN: ""
      # 'demo' pour voir la carte véhicule sans voiture, 'xpeng' pour le compte
      # constructeur (voir docs/VEHICULE.md), 'off' pour désactiver.
      VEHICLE_PROVIDER: "off"
    volumes:
      # Préférences synchronisées et identifiants véhicule. Sans ce volume,
      # tout est perdu à chaque redémarrage du conteneur.
      - xpengmedia-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  xpengmedia-data:
