name: 🐳 Build & publish Docker image (auto-hébergement NAS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 🐳 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Le NAS UGREEN DXP4800 Plus (Intel Pentium Gold 8505) est en x86-64.
          # Construire aussi arm64 imposerait une émulation QEMU qui multiplie le
          # temps de publication par 5 sans servir à rien ici. Ajouter
          # `,linux/arm64` si une machine ARM (Raspberry Pi, NAS ARM) doit un jour
          # utiliser cette image.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Résumé
        run: |
          {
            echo "## 🐳 Image publiée"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Déploiement NAS : \`docker compose up -d\` avec le \`docker-compose.yml\` du dépôt."
          } >> "$GITHUB_STEP_SUMMARY"
